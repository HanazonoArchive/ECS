name: Release Distribution

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      if: runner.os != 'Windows'
      run: chmod +x gradlew
    
    - name: Build distribution
      run: ./gradlew jlinkZip
    
    - name: Upload distribution
      uses: actions/upload-artifact@v3
      with:
        name: distribution-${{ matrix.platform }}
        path: build/distributions/
        retention-days: 30

  create-release:
    needs: build-distribution
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: distributions/
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Release Artifacts
          
          Platform-specific distributions are available above.
          
          Each distribution includes a bundled JVM and can run standalone without Java installation.
        draft: false
        prerelease: false
